name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml:compose.ci.yml
      COMPOSE_PROFILES: production
    defaults:
      run:
        working-directory: stack
        shell: bash
    steps:
      - name: Checkout complete application
        uses: actions/checkout@v4
        with:
          repository: angc-labs/CC3090-inversiones-elohim-solution
          ref: main
          submodules: recursive
          path: stack

      # Test this backend commit, not the older commit recorded by the parent.
      - name: Checkout backend under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: stack/backend
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET test suite
        run: >-
          dotnet test backend/tests/ElohimShop.Tests/ElohimShop.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=backend.trx"
          --collect:"XPlat Code Coverage"
          --results-directory "${RUNNER_TEMP}/test-results"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn

      - name: Prepare environment and temporary TLS certificate
        run: |
          cp .env.example .env
          cat > compose.ci.yml <<'YAML'
          services:
            backend:
              image: elohim-backend:ci
              environment:
                ASPNETCORE_ENVIRONMENT: Development
          YAML
          mkdir -p certbot/conf/live/dmhub.fun certbot/www
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout certbot/conf/live/dmhub.fun/privkey.pem \
            -out certbot/conf/live/dmhub.fun/fullchain.pem \
            -subj '/CN=dmhub.fun'
          docker compose config --quiet

      - name: Build and start all containers
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Verify HTTP availability
        run: |
          for url in \
            http://localhost:5000/swagger/v1/swagger.json \
            http://localhost:3000/ \
            http://localhost:3001/ \
            https://localhost/ \
            https://localhost/docs/; do
            curl --insecure --fail --silent --show-error --location \
              --retry 30 --retry-all-errors --retry-delay 5 \
              --connect-timeout 5 --max-time 20 "$url" --output /dev/null
          done
          for service in db backend frontend docs nginx; do
            container="$(docker compose ps -q "$service")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
            test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
          done

      - name: Export validated backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save elohim-backend:ci | gzip > "${RUNNER_TEMP}/backend-image.tar.gz"

      - name: Upload validated backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Show container status and logs
        if: always()
        run: |
          if [ -f compose.ci.yml ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=200
          fi

      - name: Clean up containers and volumes
        if: always()
        run: |
          if [ -f compose.ci.yml ]; then
            docker compose down --volumes --remove-orphans
          fi
