name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL "$base/$archive" -o "$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $archive\$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: >-
          gitleaks git .
          --redact
          --verbose
          --exit-code 1
          --report-format json
          --report-path "${RUNNER_TEMP}/gitleaks-report.json"

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET test suite
        run: >-
          dotnet test tests/ElohimShop.Tests/ElohimShop.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=backend.trx"
          --collect:"XPlat Code Coverage"
          --results-directory "${RUNNER_TEMP}/test-results"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn

      - name: Prepare backend-only CI compose
        run: |
          cp .env.example .env
          cat > compose.backend.ci.yml <<'YAML'
          services:
            db:
              image: postgres:16-alpine
              restart: unless-stopped
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: dmhub
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres -d dmhub"]
                interval: 5s
                timeout: 5s
                retries: 10
                start_period: 30s

            backend:
              build:
                context: .
              image: elohim-backend:ci
              depends_on:
                db:
                  condition: service_healthy
              environment:
                ASPNETCORE_ENVIRONMENT: Development
                ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=dmhub;Username=postgres;Password=postgres"
                DB_HOST: db
                DB_USER: postgres
                DB_PASSWORD: postgres
                DB_NAME: dmhub
                SEED_DATA: "true"
                SEED_USER_EMAIL: admin1@test.com
                SEED_USER_PASSWORD: "123456789"
              ports:
                - "5000:5000"

          volumes:
            postgres_data:
          YAML
          docker compose -f compose.backend.ci.yml config --quiet

      - name: Build and start backend only
        run: docker compose -f compose.backend.ci.yml up -d --build --wait --wait-timeout 300

      - name: Verify backend HTTP availability
        run: |
          curl --insecure --fail --silent --show-error --location \
            --retry 30 --retry-all-errors --retry-delay 5 \
            --connect-timeout 5 --max-time 20 \
            "http://localhost:5000/swagger/v1/swagger.json" --output /dev/null

          for service in db backend; do
            container="$(docker compose -f compose.backend.ci.yml ps -q "$service")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
            test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
          done

      - name: Run integration tests
        env:
          INTEGRATION_COMPOSE_FILE: compose.backend.ci.yml
        run: |
          tests=(tests/integration/int*.py)
          test -e "${tests[0]}"
          for test_file in "${tests[@]}"; do
            python3 "$test_file"
          done

      - name: Upload integration test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-evidence
          path: tests/integration/artifacts
          if-no-files-found: warn

      - name: Test ZAP security gate policy
        run: python3 -m unittest discover -s tests/security/zap -p 'test_*.py' -v

      - name: Run authenticated ZAP API security gate
        timeout-minutes: 35
        env:
          ZAP_BASE_URL: http://localhost:5000
          ZAP_OUTPUT_DIR: ${{ runner.temp }}/zap-artifacts
          ZAP_PROFILE_TIMEOUT_SECONDS: '900'
          ZAP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash tests/security/zap/run.sh

      - name: Summarize ZAP security gate
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          gate = Path(os.environ['RUNNER_TEMP']) / 'zap-artifacts/gate.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### ZAP API security gate\n\n')
              if not gate.exists():
                  summary.write('No gate result available. ZAP did not complete or was skipped after an earlier failure.\n')
              else:
                  result = json.loads(gate.read_text())
                  summary.write('Result: **' + ('PASS' if result['passed'] else 'FAIL') + '**\n\n')
                  for key in ('errors', 'blockingAlerts', 'acceptedAlerts', 'coverageLimitations'):
                      summary.write(f'- {key}: {len(result[key])}\n')
                  summary.write('\nSee backend-zap-security artifacts for HTML/JSON reports and exception details.\n')
          PY

      - name: Upload ZAP reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-zap-security
          path: ${{ runner.temp }}/zap-artifacts
          retention-days: 7
          if-no-files-found: error

      - name: Export validated backend image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save elohim-backend:ci | gzip > "${RUNNER_TEMP}/backend-image.tar.gz"

      - name: Upload validated backend image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Clean up remaining ZAP containers
        if: always()
        env:
          ZAP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          containers="$(docker ps -aq --filter "label=elohim.zap.run=$ZAP_RUN_ID")"
          if [ -n "$containers" ]; then
            echo "$containers" | xargs -r docker rm -f
          fi

      - name: Show backend status and logs
        if: always()
        run: |
          if [ -f compose.backend.ci.yml ]; then
            docker compose -f compose.backend.ci.yml ps -a
            docker compose -f compose.backend.ci.yml logs --no-color --tail=200
          fi

      - name: Clean up backend containers and volumes
        if: always()
        run: |
          if [ -f compose.backend.ci.yml ]; then
            docker compose -f compose.backend.ci.yml down --volumes --remove-orphans
          fi
